# WindEffects rendering scalability profile — High-End (production target)
# Authoritative runtime configuration. Missing keys fall back to engine builtins.

[Profile]
Name=High-End

[Resolution]
ScreenPercentage=100.0
MaxShadowMapResolution=4096
MSAASamples=1
DynamicResolution=false

[Geometry]
Quality=Ultra
LodBias=0.0
MeshShaders=true
MeshShaderRequirement=Preferred

[Textures]
Quality=Ultra
Anisotropy=16.0
StreamingPoolMb=1024

[Lighting]
Enabled=true
Quality=High
MaxLocalLights=128

[Shadows]
Enabled=true
Quality=Ultra
CascadeCount=4
ResolutionScale=1.0
SoftShadows=true
ContactShadows=true

[Reflections]
Enabled=true
Quality=High
ScreenSpace=true
RayTraced=true
RayTracingRequirement=Preferred

[GlobalIllumination]
Enabled=true
Quality=High
RayTraced=true
RayTracingRequirement=Preferred

[Terrain]
Enabled=true
Quality=Ultra
LodBias=0.75
ClipmapLevels=10

[Foliage]
Enabled=true
Quality=Ultra
DensityScale=1.0
LodBias=0.0

[Atmosphere]
Enabled=true
Quality=High

[Volumetrics]
Enabled=true
Quality=High
ResolutionScale=0.75
MaxSteps=64

[Water]
Enabled=true
Quality=High
Reflections=true
Caustics=true

[Particles]
Enabled=true
Quality=High
BudgetScale=1.0

[PostProcess]
Enabled=true
Quality=High
Bloom=true
MotionBlur=true
AmbientOcclusion=true
TemporalAA=true

[LOD]
GlobalBias=0.0
CullDistanceScale=1.0

[Streaming]
TexturePoolMb=1024
MeshPoolMb=512
IoBudgetScale=1.0
